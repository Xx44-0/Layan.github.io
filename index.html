<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layan Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/4c3c1e9a2e.js" crossorigin="anonymous"></script>

<style>

/* ===== Background ===== */
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background:#f6f7fb;
  color:#1f2a44;
  overflow-x:hidden;
}

/* moving neon lines */
.lines{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

.lines span{
  position:absolute;
  width:2px;
  height:220px;
  background:linear-gradient(transparent,#7a5cff,#4cc9f0,transparent);
  animation:move 7s linear infinite;
  opacity:.35;
}

.lines span:nth-child(1){left:10%;}
.lines span:nth-child(2){left:25%;animation-delay:1s;}
.lines span:nth-child(3){left:40%;animation-delay:2s;}
.lines span:nth-child(4){left:60%;animation-delay:1.5s;}
.lines span:nth-child(5){left:75%;animation-delay:3s;}
.lines span:nth-child(6){left:90%;animation-delay:2.5s;}

@keyframes move{
  0%{transform:translateY(-200px);}
  100%{transform:translateY(100vh);}
}

/* ===== Header ===== */
header{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  padding:80px;
}

header img{
  width:150px;
  border-radius:18px;
  box-shadow:0 15px 35px rgba(122,92,255,.25);
}

.name{
  margin-top:20px;
}

.name h1{
  margin:0;
  font-size:44px;
  color:#3b3b98;
}

.name p{
  margin:6px 0;
  color:#6a5cff;
}

/* buttons */
.top-buttons{
  position:absolute;
  top:40px;
  right:60px;
}

button{
  background:#6a5cff;
  border:none;
  color:white;
  padding:8px 14px;
  border-radius:8px;
  margin-left:10px;
  cursor:pointer;
}

/* ===== Sections ===== */
section{
  padding:60px 80px;
}

h2{
  color:#3b3b98;
}

/* ===== Skills Cards ===== */
.skills-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
  text-align:center;
  transition:.35s;
}

.card i{
  font-size:26px;
  color:#6a5cff;
  margin-bottom:10px;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 20px rgba(106,92,255,.25);
}

/* ===== Projects ===== */
.projects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.projects img{
  width:100%;
  border-radius:12px;
  transition:.3s;
}

.projects img:hover{
  transform:scale(1.05);
}

/* ===== Certificate ===== */
.certificate img{
  width:300px;
  border-radius:14px;
}

/* ===== Email ===== */
.email{
  text-align:center;
  font-size:30px;
  padding:70px;
  animation:floatMail 3s ease-in-out infinite;
}

@keyframes floatMail{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}

/* ===== Scroll Reveal ===== */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:1.4s;
}

.reveal.show{
  opacity:1;
  transform:translateY(0);
}

</style>
</head>

<body>

<div class="lines">
<span></span><span></span><span></span>
<span></span><span></span><span></span>
</div>

<div class="top-buttons">
<button onclick="translatePage()">EN</button>
<button onclick="downloadCV()">CV</button>
</div>

<header>
<img src="profile.jpg">

<div class="name">
<p>Hi I'm</p>
<h1>Layan</h1>
<p>خريجة تجارة إلكترونية ودعم لوجستي</p>
</div>
</header>

<section class="reveal">
<h2>About Me</h2>
<p>
خريجة تخصص تجارة إلكترونية ودعم لوجستي، مهتمة بإدارة المتاجر الإلكترونية
وتحسين تجربة العملاء وتنظيم العمليات التجارية.
</p>
</section>

<section class="reveal">
<h2>Skills</h2>

<div class="skills-grid">
<div class="card"><i class="fa-solid fa-laptop"></i>Microsoft Office</div>
<div class="card"><i class="fa-solid fa-bullhorn"></i>التسويق الرقمي</div>
<div class="card"><i class="fa-solid fa-store"></i>إدارة المتاجر</div>
<div class="card"><i class="fa-solid fa-box"></i>إدارة المنتجات</div>
<div class="card"><i class="fa-solid fa-users"></i>العمل الجماعي</div>
<div class="card"><i class="fa-solid fa-lightbulb"></i>حل المشكلات</div>
</div>

</section>

<section class="reveal certificate">
<h2>Certificates</h2>
<img src="certificate.jpg">
</section>

<section class="reveal">
<h2>Projects</h2>

<div class="projects">
<img src="p1.jpg">
<img src="p2.jpg">
<img src="p3.jpg">
<img src="p4.jpg">
<img src="p5.jpg">
<img src="p6.jpg">
</div>

</section>

<div class="email">
<a href="mailto:your@email.com"><i class="fa-solid fa-envelope"></i></a>
</div>

<script>
const items=document.querySelectorAll(".reveal");
window.addEventListener("scroll",()=>{
  items.forEach(el=>{
    if(el.getBoundingClientRect().top<window.innerHeight-100){
      el.classList.add("show");
    }
  });
});

function translatePage(){
  alert("English version coming soon");
}

function downloadCV(){
  window.open("cv.pdf");
}
</script>

</body>
</html>
